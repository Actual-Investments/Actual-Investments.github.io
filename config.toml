# =============================================================================
#  Actual Investments — site configuration
#  This single file controls the whole website. The most important values you
#  may want to change are clearly marked with  >>> CHANGE ME <<<  below.
# =============================================================================

# The address your finished site lives at. Because this repo is named
# "Actual-Investments.github.io", GitHub serves it at the root domain below.
base_url = "https://Actual-Investments.github.io"

# The name shown in the browser tab.
title = "Actual Investments — Trading Signals"

# Compiles the theme's styles. Leave this on or the site loses all styling.
compile_sass = true

# Which theme to use. Don't change this.
theme = "terminimal"

# This site is a single product page, so we don't need search or RSS feeds.
build_search_index = false
generate_feeds = false

[markdown]
# Syntax highlighting style for any code blocks you write.
highlighting = { theme = "dracula-soft" }

[slugify]
paths = "safe"


[extra]
# ---------------------------------------------------------------------------
#  Look & feel
# ---------------------------------------------------------------------------

# Color accent. One of: blue, green, orange, pink, purple, red.
# Append -light for a light theme (e.g. "green-light") or -auto to follow the
# visitor's system setting (e.g. "green-auto").
accent_color = "green"

# Page background. One of: blue, dark, green, orange, pink, red, light, auto.
background_color = "dark"

# Text shown in the top-left "logo" spot. The company name is just
# "Actual Investments"; the subtitle clarifies what the site offers.
logo_text = "Actual Investments"
logo_subtitle = "Trading Signals"

# Name used in the copyright line at the bottom of the page.
author = "Actual Investments"

# ---------------------------------------------------------------------------
#  Optional background image + page transparency  ( >>> CHANGE ME <<< )
# ---------------------------------------------------------------------------
# Drop an image in static/img/ and set the path here (e.g. "/img/background.jpg")
# to turn on a full-page background. Leave it "" for the plain dark background.
background_image = ""
# How opaque the page is OVER the background image (0 = image fully visible,
# 1 = image hidden). Lower = more of the image shows through. The disclaimer
# stays fully opaque regardless.
content_opacity = 0.88

# Button styling. Combine any of: rounded, outline, underlined_link.
button_style = 'rounded outline'

# Optional site icon shown in the browser tab. Drop a file in static/ and
# point to it here, e.g. favicon = "/favicon.png".
# favicon = "/favicon.png"
# favicon_mimetype = "image/png"


# ---------------------------------------------------------------------------
#  Top navigation bar (these jump to sections on the page)
# ---------------------------------------------------------------------------
# Note: "$BASE_URL" is replaced with your site address automatically, so these
# links work from any page (e.g. the About page jumps back to the home section).
menu_items = [
    {name = "Ways to trade", url = "$BASE_URL/#ways"},
    {name = "Projections",   url = "$BASE_URL/#calculator"},
    {name = "Pricing",       url = "$BASE_URL/#pricing"},
    {name = "Proof",         url = "$BASE_URL/proof"},
    {name = "Affiliate",     url = "$BASE_URL/affiliates"},
    {name = "About",         url = "$BASE_URL/about"},
    {name = "Book a call",   url = "$BASE_URL/#book"},
]


# ---------------------------------------------------------------------------
#  Booking & contact  ( >>> CHANGE ME <<< )
# ---------------------------------------------------------------------------

# Your Calendly scheduling link. Create a free account at https://calendly.com,
# make an event type (e.g. "Onboarding Call"), then paste its link here.
# It looks like: https://calendly.com/your-name/onboarding-call
calendly_url = "https://calendly.com/loganmcclain59/30min"

# Your Web3Forms access key. Get a free key in seconds at
# https://web3forms.com  — enter the email you want submissions sent to and it
# emails you an access key. Paste that key here.
# (The email you register with Web3Forms is where form submissions are sent.)
web3forms_key = "YOUR-WEB3FORMS-ACCESS-KEY"
